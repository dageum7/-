<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 이상형 월드컵 💛</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --cream: #fff9e9;
      --cream-dark: #fff0bd;
      --yellow: #ffd95a;
      --yellow-dark: #e9ae22;
      --brown: #5d482b;
      --brown-light: #8a704c;
      --white: #fffdf7;
      --shadow: 0 12px 35px rgba(112, 82, 28, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Pretendard",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        system-ui,
        sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #fff0a8 0 7%, transparent 7.5%),
        radial-gradient(circle at 90% 85%, #ffe8a0 0 8%, transparent 8.5%),
        var(--cream);
      color: var(--brown);
    }

    button {
      font-family: inherit;
    }

    .app {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 45px 0 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header .emoji {
      font-size: 54px;
      display: block;
      margin-bottom: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: -2px;
    }

    .header p {
      margin: 12px 0 0;
      color: var(--brown-light);
      font-size: 18px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro-card,
    .game-card,
    .result-card {
      background: rgba(255, 253, 247, 0.94);
      border: 2px solid #f4df9b;
      border-radius: 30px;
      box-shadow: var(--shadow);
    }

    .intro-card {
      text-align: center;
      padding: 48px 30px;
    }

    .intro-icon {
      font-size: 75px;
      margin-bottom: 15px;
    }

    .intro-card h2 {
      font-size: 30px;
      margin: 0 0 14px;
    }

    .intro-card p {
      font-size: 18px;
      line-height: 1.8;
      color: var(--brown-light);
      margin: 0 auto 28px;
      max-width: 620px;
    }

    .start-button,
    .restart-button {
      border: 0;
      background: var(--yellow);
      color: #4c3818;
      font-size: 21px;
      font-weight: 800;
      padding: 17px 38px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 7px 0 var(--yellow-dark);
      transition: 0.15s ease;
    }

    .start-button:hover,
    .restart-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 0 var(--yellow-dark);
    }

    .start-button:active,
    .restart-button:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 var(--yellow-dark);
    }

    .game-card {
      padding: 30px;
    }

    .game-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .round-label {
      font-size: 20px;
      font-weight: 800;
    }

    .match-count {
      background: var(--cream-dark);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 15px;
      font-weight: 700;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #f3e9ca;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--yellow);
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    .question {
      text-align: center;
      margin-bottom: 25px;
    }

    .question h2 {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
    }

    .question p {
      color: var(--brown-light);
      margin: 8px 0 0;
      font-size: 16px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .choice {
      min-height: 230px;
      border: 3px solid #f0dfaa;
      background: #fffaf0;
      border-radius: 25px;
      cursor: pointer;
      padding: 30px 20px;
      color: var(--brown);
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .choice:hover {
      border-color: var(--yellow);
      background: #fff7d9;
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(112, 82, 28, 0.10);
    }

    .choice .choice-emoji {
      font-size: 66px;
      margin-bottom: 16px;
    }

    .choice .choice-name {
      font-size: clamp(22px, 4vw, 29px);
      font-weight: 900;
    }

    .choice .choice-desc {
      font-size: 15px;
      color: var(--brown-light);
      margin-top: 8px;
    }

    .result-card {
      text-align: center;
      padding: 40px 30px;
    }

    .result-card .small-title {
      font-size: 17px;
      color: var(--brown-light);
      font-weight: 700;
    }

    .result-card h2 {
      font-size: clamp(30px, 6vw, 48px);
      margin: 8px 0 25px;
    }

    .animal-box {
      background: linear-gradient(135deg, #fff4bb, #fff9e9);
      border-radius: 27px;
      padding: 30px 22px;
      margin: 0 auto 22px;
      max-width: 650px;
      border: 2px solid #f4dfa0;
    }

    .animal {
      font-size: 90px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .animal-name {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .reason {
      font-size: 17px;
      line-height: 1.8;
      color: var(--brown-light);
      margin: 0 auto;
      max-width: 530px;
    }

    .match-box {
      background: #fffdf7;
      border: 2px dashed #e7c96e;
      border-radius: 22px;
      padding: 22px;
      margin: 0 auto 28px;
      max-width: 650px;
    }

    .match-box .label {
      font-size: 15px;
      color: var(--brown-light);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .match-box .type {
      font-size: 25px;
      font-weight: 900;
    }

    .match-box p {
      margin: 8px 0 0;
      color: var(--brown-light);
      line-height: 1.6;
    }

    .tip {
      font-size: 14px;
      color: #a08762;
      margin-top: 20px;
    }

    @media (max-width: 650px) {
      .app {
        width: min(100% - 20px, 920px);
        padding-top: 25px;
      }

      .intro-card,
      .game-card,
      .result-card {
        border-radius: 23px;
      }

      .game-card {
        padding: 20px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .choice {
        min-height: 175px;
        padding: 22px 15px;
      }

      .choice .choice-emoji {
        font-size: 50px;
        margin-bottom: 9px;
      }

      .game-top {
        align-items: flex-start;
      }

      .round-label {
        font-size: 17px;
      }

      .match-count {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <span class="emoji">💛</span>
      <h1>이상형 월드컵</h1>
      <p>내 마음속 이상형 요소를 하나씩 골라보세요!</p>
    </header>

    <!-- 시작 화면 -->
    <section id="introScreen" class="screen active">
      <div class="intro-card">
        <div class="intro-icon">🌼</div>
        <h2>나의 이상형은 어떤 모습일까?</h2>
        <p>
          머리 길이부터 눈매, 웃는 모습, 말투까지<br>
          16가지 매력 요소 중 마음에 드는 쪽을 골라주세요.<br>
          마지막에는 나와 잘 어울리는 동물과 궁합 유형을 알려드려요!
        </p>
        <button class="start-button" onclick="startGame()">월드컵 시작하기 ✨</button>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="gameScreen" class="screen">
      <div class="game-card">

        <div class="game-top">
          <div class="round-label" id="roundLabel">예선</div>
          <div class="match-count" id="matchCount">1 / 8</div>
        </div>

        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question">
          <h2>어느 쪽이 더 끌리나요?</h2>
          <p>더 마음에 드는 이상형 요소를 하나 선택하세요 💕</p>
        </div>

        <div class="choices">
          <button class="choice" id="choiceA" onclick="choose(0)">
            <span class="choice-emoji"></span>
            <span class="choice-name"></span>
            <span class="choice-desc"></span>
          </button>

          <button class="choice" id="choiceB" onclick="choose(1)">
            <span class="choice-emoji"></span>
            <span class="choice-name"></span>
            <span class="choice-desc"></span>
          </button>
        </div>

      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="resultScreen" class="screen">
      <div class="result-card">

        <div class="small-title">🏆 최종 선택</div>
        <h2 id="resultTitle"></h2>

        <div class="animal-box">
          <div class="animal" id="animalEmoji"></div>
          <div class="animal-name" id="animalName"></div>
          <p class="reason" id="animalReason"></p>
        </div>

        <div class="match-box">
          <div class="label">💛 잘 맞는 다른 유형</div>
          <div class="type" id="matchType"></div>
          <p id="matchReason"></p>
        </div>

        <button class="restart-button" onclick="restartGame()">
          다시 고르기 🔄
        </button>

        <div class="tip">
          ※ 재미로 보는 이상형 테스트예요 :)
        </div>

      </div>
    </section>

  </main>

        reason: "아담하고 귀여운 분위기는\n작지만 생기 넘치는 다람쥐의 사랑스러움과 닮았어요.",
        match: "세심하게 챙겨주는 타입",
        matchReason: "서로 부족한 부분을 자연스럽게 채워주며 다정하게 가까워지는 궁합이에요."
      }
    ];

    let currentRound = [];
    let nextRound = [];
    let currentIndex = 0;
    let totalMatches = 0;
    let completedMatches = 0;
    let finalWinner = null;

    const introScreen = document.getElementById("introScreen");
    const gameScreen = document.getElementById("gameScreen");
    const resultScreen = document.getElementById("resultScreen");

    const roundLabel = document.getElementById("roundLabel");
    const matchCount = document.getElementById("matchCount");
    const progressBar = document.getElementById("progressBar");

    const choiceA = document.getElementById("choiceA");
    const choiceB = document.getElementById("choiceB");

    function showScreen(screen) {
      [introScreen, gameScreen, resultScreen].forEach(s => {
        s.classList.remove("active");
      });
      screen.classList.add("active");
    }

    function startGame() {
      currentRound = shuffle([...originalItems]);
      currentIndex = 0;
      nextRound = [];
      completedMatches = 0;
      totalMatches = 15;

      showScreen(gameScreen);
      renderMatch();
    }

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function getRoundName() {
      if (currentRound.length === 16) return "16강";
      if (currentRound.length === 8) return "8강";
      if (currentRound.length === 4) return "4강";
      if (currentRound.length === 2) return "결승";
      return "최종";
    }

    function renderMatch() {
      if (currentRound.length === 1) {
        finalWinner = currentRound[0];
        showResult();
        return;
      }

      const a = currentRound[currentIndex];
      const b = currentRound[currentIndex + 1];

      const matchesInRound = currentRound.length / 2;

      roundLabel.textContent = getRoundName();
      matchCount.textContent =
        `${Math.floor(currentIndex / 2) + 1} / ${matchesInRound}`;

      const progress =
        (completedMatches / totalMatches) * 100;

      progressBar.style.width = `${Math.min(progress, 100)}%`;

      setChoice(choiceA, a);
      setChoice(choiceB, b);
    }

    function setChoice(button, item) {
      button.querySelector(".choice-emoji").textContent = item.emoji;
      button.querySelector(".choice-name").textContent = item.name;
      button.querySelector(".choice-desc").textContent = item.desc;
    }

    function choose(which) {
      const winner = currentRound[currentIndex + which];

      nextRound.push(winner);
      currentIndex += 2;
      completedMatches++;

      /*
        현재 라운드가 끝났으면 다음 라운드로 이동
      */
      if (currentIndex >= currentRound.length) {
        currentRound = nextRound;
        nextRound = [];
        currentIndex = 0;
      }

      renderMatch();
    }

    function showResult() {
      showScreen(resultScreen);

      progressBar.style.width = "100%";

      document.getElementById("resultTitle").textContent =
        finalWinner.name;

      document.getElementById("animalEmoji").textContent =
        finalWinner.animal;

      document.getElementById("animalName").textContent =
        finalWinner.animalName;

      document.getElementById("animalReason").innerHTML =
        finalWinner.reason.replace(/\n/g, "<br>");

      document.getElementById("matchType").textContent =
        finalWinner.match;

      document.getElementById("matchReason").textContent =
        finalWinner.matchReason;
    }

    function restartGame() {
      finalWinner = null;
      currentRound = [];
      nextRound = [];
      currentIndex = 0;
      completedMatches = 0;

      showScreen(introScreen);
    }
  </script>

</body>
</html>
